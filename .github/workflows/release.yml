name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_STEAM_PROXY_URL: ${{ vars.VITE_STEAM_PROXY_URL || 'https://corx.venipa.workers.dev' }}
          VITE_TMDB_PROXY_URL: ${{ vars.VITE_TMDB_PROXY_URL }}

      - name: Zip dist
        run: zip -r cover-forge-${{ github.ref_name }}.zip dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: cover-forge-${{ github.ref_name }}.zip
